<body class="app-body" data-page="home">
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">N</span><span>NEWS</span></a>
    <div class="topbar-actions">
      <span class="live-indicator"><i></i><span id="edition-label">تغطية العالم</span></span>

  <main class="page-shell">
    <section class="welcome-row">
      <div>
        <div class="section-kicker" id="welcome-eyebrow">الأخبار كما تحدث</div>
        <h1 id="welcome-title">أهلًا بك، <span id="welcome-name">قارئ News</span></h1>

      </div>
      <div class="edition-select-wrap">

        <select id="country-select" class="select-field"></select>
      </div>
    </section>

    <section class="search-panel">
      <span class="search-icon">⌕</span>
      <input id="news-search" type="search" placeholder="ابحث في الأخبار والعناوين..." autocomplete="off">
      <button id="clear-search" class="clear-search hidden" type="button" aria-label="مسح البحث">×</button>
    </section>

    <section class="headline-row">
      <div>
        <div class="section-kicker" id="feed-kicker">مختارات من المصادر</div>

      </div>
      <button class="refresh-button" id="refresh-news" type="button"><span>↻</span><span id="refresh-label">تحديث</span></button>
    </section>

    <div class="category-strip" id="category-strip" aria-label="تصنيفات الأخبار">
      <button class="category-chip active" data-category="all" type="button">الكل</button>
      <button class="category-chip" data-category="world" type="button">العالم</button>
      <button class="category-chip" data-category="politics" type="button">سياسة</button>
      <button class="category-chip" data-category="business" type="button">اقتصاد</button>
      <button class="category-chip" data-category="technology" type="button">تكنولوجيا</button>
      <button class="category-chip" data-category="sports" type="button">رياضة</button>
      <button class="category-chip" data-category="culture" type="button">ثقافة</button>
    </div>

    <div id="news-status" class="status-line" role="status" aria-live="polite">جارٍ تجهيز الأخبار...</div>
    <section id="news-grid" class="news-grid" aria-live="polite"></section>

    <section class="favorites-section" id="favorites-section">
      <div class="headline-row favorites-heading-row">
        <div>
          <div class="section-kicker" id="favorites-kicker">احتفظ بما يهمك</div>
          <h2 id="favorites-title">المفضلة <span class="count-badge" id="favorites-count">0</span></h2>
        </div>
        <button class="text-button" id="show-all-news" type="button">كل الأخبار</button>
      </div>
      <div id="favorites-status" class="status-line">الأخبار التي تحفظها ستظهر هنا.</div>
      <section id="favorites-grid" class="news-grid favorites-grid"></section>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <a class="nav-item selected" href="./" data-nav="home"><span class="nav-symbol">⌂</span><small id="nav-home">الرئيسية</small></a>

  const COUNTRIES = ('AF AL DZ AS AD AO AI AQ AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BV BR IO BN BG BF BI CV KH CM CA KY CF TD CL CN CX CC CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF TF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT HM VA HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA GS SS ES LK SD SR SJ SE CH SY TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UM UY UZ VU VE VN VG VI WF EH YE ZM ZW').split(' ');
  const CATEGORY_WORDS = {
    politics: /سياس|حكوم|انتخاب|برلمان|رئيس|وزير|دبلوماس|دستور|politic|election|government|president|minister|parliament|diplomac/i,
    business: /اقتصاد|مال|أسواق|اسواق|بنك|تجارة|نفط|دولار|استثمار|business|market|econom|finance|bank|trade|oil|stock|invest/i,
    technology: /تقني|تكنولوج|ذكاء اصطناعي|إنترنت|انترنت|هاتف|رقمي|تطبيق|technology|tech|artificial intelligence|AI\b|internet|digital|phone|app|cyber/i,
    sports: /رياض|كرة|مباراة|دوري|بطولة|لاعب|sport|football|soccer|match|league|championship|player|tennis/i,
    culture: /ثقاف|فن|سينما|موسيقى|كتاب|مهرجان|culture|art|cinema|music|book|festival|film/i
  };
  const BREAKING_WORDS = /عاجل|الآن|الان|قبل قليل|تطور عاجل|انفجار|زلزال|هجوم|إطلاق نار|اطلاق نار|استقال|اغتيال|وفاة|تحذير|إغلاق|اغلاق|emergency|breaking|just in|developing|earthquake|explosion|attack|resigns?|dies|warning|shut(?:s|ting)? down/i;
  const FEEDS = {
    ar: [
      { name: 'BBC عربي', url: 'https://feeds.bbci.co.uk/arabic/rss.xml' },
      { name: 'DW عربية', url: 'https://rss.dw.com/xml/rss-ar-all' }
    ],
    en: [
      { name: 'BBC World', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
      { name: 'The Guardian', url: 'https://www.theguardian.com/world/rss' }
    ]
  };
  let allStories = [];
  let visibleCategory = 'all';
  let searchTerm = '';
  let currentLanguage = 'ar';
  let currentUserId = 'guest';

  const $ = (id) => document.getElementById(id);
  const escapeHTML = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
  const prefs = () => { try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch (_) { return {}; } };
  const savedKey = () => `news_saved_${currentUserId}`;
  function getSaved() { try { return new Set(JSON.parse(localStorage.getItem(savedKey()) || '[]')); } catch (_) { return new Set(); } }
  function setSaved(set) { localStorage.setItem(savedKey(), JSON.stringify(Array.from(set))); }
  function localeCountryName(code, language) { try { return new Intl.DisplayNames([language], { type: 'region' }).of(code) || code; } catch (_) { return code; } }
  function populateCountries() {
    const select = $('country-select');
    if (!select) return;
    const preference = prefs();
    const detected = (navigator.language.split('-')[1] || 'EG').toUpperCase();
    const selected = preference.country || (COUNTRIES.includes(detected) ? detected : 'EG');
    select.innerHTML = COUNTRIES.map(code => `<option value="${code}" ${code === selected ? 'selected' : ''}>${escapeHTML(localeCountryName(code, 'ar'))}</option>`).join('');
    select.addEventListener('change', () => {
      const next = prefs(); next.country = select.value; next.language = ARABIC_COUNTRIES.has(select.value) ? 'ar' : 'en';
      localStorage.setItem(PREF_KEY, JSON.stringify(next));
      localStorage.removeItem('news_language_preference');
      window.location.reload();
    });

    currentLanguage = manual || preference.language || (ARABIC_COUNTRIES.has(selected) ? 'ar' : 'en');
  }
  function applyLanguage() {

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    const labels = lang === 'ar' ? {
      welcome:'الأخبار كما تحدث', subtitle:'ملخص لأبرز العناوين من مصادرها.', country:'الدولة / المنطقة', search:'ابحث في الأخبار والعناوين...',
      kicker:'مختارات من المصادر', feed:'آخر الأخبار', refresh:'تحديث', all:'الكل', world:'العالم', politics:'سياسة', business:'اقتصاد', technology:'تكنولوجيا', sports:'رياضة', culture:'ثقافة',
      favorites:'المفضلة', savedHint:'الأخبار التي تحفظها ستظهر هنا.', home:'الرئيسية', breaking:'عاجل', account:'حسابي', empty:'لا توجد نتائج مطابقة حاليًا.',
      loading:'جارٍ جلب الأخبار من المصادر...', failed:'تعذر تحميل الأخبار الآن. افحص اتصال الإنترنت وحاول التحديث.', noBreaking:'لا توجد عناوين مطابقة لكلمات العاجل حاليًا.', source:'المصدر', open:'اقرأ من المصدر', save:'حفظ', remove:'إزالة', time:'وقت النشر غير محدد', updated:'آخر تحديث'
    } : {
      welcome:'NEWS AS IT HAPPENS', subtitle:'A selection of headlines from their original sources.', country:'Country / region', search:'Search stories and headlines...',
      kicker:'FROM THE SOURCES', feed:'Latest stories', refresh:'Refresh', all:'All', world:'World', politics:'Politics', business:'Business', technology:'Technology', sports:'Sports', culture:'Culture',
      favorites:'Saved stories', savedHint:'Stories you save will appear here.', home:'Home', breaking:'Breaking', account:'Account', empty:'No matching stories right now.',
      loading:'Loading stories from sources...', failed:'Stories could not be loaded. Check your connection and refresh.', noBreaking:'No headlines currently match the breaking-news keywords.', source:'Source', open:'Read at source', save:'Save', remove:'Remove', time:'Publication time unavailable', updated:'Last updated'
    };
    const setText = (id, value) => { const el = $(id); if (el) el.textContent = value; };
    setText('welcome-eyebrow', labels.welcome); setText('welcome-subtitle', labels.subtitle); setText('country-label', labels.country);
    const search = $('news-search'); if (search) search.placeholder = labels.search;
    setText('feed-kicker', labels.kicker); setText('feed-heading', labels.feed); setText('refresh-label', labels.refresh);
    setText('favorites-kicker', lang === 'ar' ? 'احتفظ بما يهمك' : 'KEEP WHAT MATTERS'); setText('favorites-title', labels.favorites);
    setText('favorites-status', labels.savedHint); setText('nav-home', labels.home); setText('nav-breaking', labels.breaking); setText('nav-favorites', labels.favorites); setText('nav-account', labels.account);
    const langButton = $('language-toggle'); if (langButton) langButton.textContent = lang === 'ar' ? 'EN' : 'عربي';
    const categories = $('category-strip');
    if (categories) categories.querySelectorAll('[data-category]').forEach(button => { button.textContent = labels[button.dataset.category] || labels.all; });
    const edition = $('edition-label'); if (edition && $('country-select')) edition.textContent = localeCountryName($('country-select').value, lang);
    const breakingTitle = $('breaking-title'); if (breakingTitle && lang === 'en') breakingTitle.textContent = 'Breaking news';
    const breakingDescription = $('breaking-description'); if (breakingDescription && lang === 'en') breakingDescription.textContent = 'Headlines flagged by urgent keywords. Open the original source to verify details.';
    window.newsLabels = labels;
  }
  function parseDate(value) { const date = value ? new Date(value) : null; return date && !Number.isNaN(date.getTime()) ? date : null; }
  function formatDate(date) {
    if (!date) return window.newsLabels.time;
    try { return new Intl.DateTimeFormat(currentLanguage === 'ar' ? 'ar-EG' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }).format(date); }
    catch (_) { return date.toLocaleString(); }
  }
  function classify(text) {
    for (const [category, pattern] of Object.entries(CATEGORY_WORDS)) if (pattern.test(text)) return category;
    return 'world';
  }
  function normalizeStory(story, feedName) {
    const title = (story.title || '').trim();
    const link = (story.link || story.url || '').trim();
    if (!title || !/^https?:\/\//i.test(link)) return null;
    const description = String(story.description || story.content || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;|&#160;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
    const date = parseDate(story.pubDate || story.published || story.isoDate || story.date);
    const id = link;
    return { id, title, description: description.slice(0, 330), link, source: story.source || feedName, date, category: classify(`${title} ${description}`), breaking: BREAKING_WORDS.test(title), language: currentLanguage };
  }
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try { return await fetch(url, { signal: controller.signal, cache: 'no-store' }); }
    finally { clearTimeout(timer); }
  }
  async function fetchFeed(feed) {
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(feed.url);
    try {
      const response = await fetchWithTimeout(proxyUrl, 12000);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const xmlText = await response.text();
      const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
      if (xml.querySelector('parsererror')) throw new Error('Invalid RSS response');
      const items = Array.from(xml.querySelectorAll('item, entry'));
      return items.map(item => {
        const get = (selector) => item.querySelector(selector)?.textContent?.trim() || '';
        const linkNode = item.querySelector('link');
        const link = linkNode?.textContent?.trim() || linkNode?.getAttribute('href') || '';
        return normalizeStory({ title:get('title'), link, description:get('description') || get('summary') || get('content'), pubDate:get('pubDate') || get('published') || get('updated') }, feed.name);
      }).filter(Boolean);
    } catch (firstError) {
      // Fallback converter is also free, but can be rate-limited by its provider.
      try {
        const fallback = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url);
        const response = await fetchWithTimeout(fallback, 12000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        if (!Array.isArray(json.items)) throw new Error('No RSS items');
        return json.items.map(item => normalizeStory(item, feed.name)).filter(Boolean);
      } catch (secondError) {
        console.warn(`Feed failed (${feed.name}):`, firstError, secondError);
        return [];
      }
    }
  }
  function readCache() {
    try {
      const value = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (value && value.lang === currentLanguage && Date.now() - value.time < CACHE_TTL && Array.isArray(value.items)) return value.items.map(item => ({ ...item, date: parseDate(item.date) }));
    } catch (_) { /* ignore invalid cache */ }
    return null;
  }
  async function loadStories(force) {
    const status = $('news-status') || $('breaking-status');
    if (!force) {
      const cached = readCache();
      if (cached && cached.length) { allStories = cached; renderAll(); if (status && !allStories.length) status.textContent = window.newsLabels.loading; }
    }
    if (status) status.textContent = window.newsLabels.loading;
    const feedList = FEEDS[currentLanguage] || FEEDS.en;
    const batches = await Promise.all(feedList.map(fetchFeed));
    const combined = batches.flat();
    const unique = new Map();
    combined.forEach(item => { if (!unique.has(item.id)) unique.set(item.id, item); });
    allStories = Array.from(unique.values()).sort((a,b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0)).slice(0, MAX_ITEMS);
    if (allStories.length) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time:Date.now(), lang:currentLanguage, items:allStories })); } catch (_) { /* storage may be full */ }
      if (status) status.textContent = `${allStories.length} ${currentLanguage === 'ar' ? 'خبرًا من المصادر' : 'stories from sources'}`;
    } else {
      if (status) status.textContent = window.newsLabels.failed;
    }
    renderAll();
  }
  function storyCard(story, savedSet) {
    const saved = savedSet.has(story.id);
    const categoryLabels = currentLanguage === 'ar' ? { world:'العالم', politics:'سياسة', business:'اقتصاد', technology:'تكنولوجيا', sports:'رياضة', culture:'ثقافة' } : { world:'World', politics:'Politics', business:'Business', technology:'Technology', sports:'Sports', culture:'Culture' };
    return `<article class="news-card">
      <div class="news-card-top"><span class="source-name">${escapeHTML(story.source)}</span><span class="news-category">${escapeHTML(categoryLabels[story.category] || categoryLabels.world)}</span></div>
      <h3>${escapeHTML(story.title)}</h3>
      ${story.description ? `<p class="news-summary">${escapeHTML(story.description)}</p>` : ''}
      <div class="news-card-footer"><span class="news-time">${escapeHTML(formatDate(story.date))}</span><div class="card-actions"><button class="save-button ${saved ? 'saved' : ''}" type="button" data-save="${encodeURIComponent(story.id)}">${saved ? '★' : '☆'} ${saved ? window.newsLabels.remove : window.newsLabels.save}</button><a class="source-link" href="${escapeHTML(story.link)}" target="_blank" rel="noopener noreferrer">${window.newsLabels.open} ↗</a></div></div>
    </article>`;
  }
  function attachSaveHandlers(root) {
    if (!root) return;
    root.querySelectorAll('[data-save]').forEach(button => button.addEventListener('click', () => {
      let id; try { id = decodeURIComponent(button.dataset.save); } catch (_) { return; }
      const saved = getSaved();
      if (saved.has(id)) saved.delete(id); else saved.add(id);
      setSaved(saved);
      renderAll();
    }));
  }
  function matchingStories() {
    return allStories.filter(story => {
      const categoryOK = visibleCategory === 'all' || story.category === visibleCategory;
      const haystack = `${story.title} ${story.description} ${story.source}`.toLocaleLowerCase();
      return categoryOK && (!searchTerm || haystack.includes(searchTerm.toLocaleLowerCase()));
    });
  }
  function renderGrid(root, stories, emptyText, saved) {
    if (!root) return;
    if (!stories.length) { root.innerHTML = `<div class="empty-state">${escapeHTML(emptyText)}</div>`; return; }
    root.innerHTML = stories.map(story => storyCard(story, saved)).join('');
    attachSaveHandlers(root);
  }
  function renderAll() {
    const saved = getSaved();
    const filtered = matchingStories();
    const newsGrid = $('news-grid');
    renderGrid(newsGrid, filtered, window.newsLabels.empty, saved);
    const favorites = allStories.filter(story => saved.has(story.id));
    const favoritesGrid = $('favorites-grid');
    renderGrid(favoritesGrid, favorites, window.newsLabels.savedHint, saved);
    const count = $('favorites-count'); if (count) count.textContent = String(saved.size);
    const favoritesStatus = $('favorites-status'); if (favoritesStatus) favoritesStatus.textContent = favorites.length ? `${favorites.length} ${currentLanguage === 'ar' ? 'خبر محفوظ' : 'saved stories'}` : window.newsLabels.savedHint;
    const breakingList = $('breaking-list');
    if (breakingList) {
      const breaking = allStories.filter(story => story.breaking);
      renderGrid(breakingList, breaking, window.newsLabels.noBreaking, saved);
      const breakingStatus = $('breaking-status'); if (breakingStatus) breakingStatus.textContent = breaking.length ? `${breaking.length} ${currentLanguage === 'ar' ? 'عنوانًا مطابقًا لكلمات العاجل' : 'headlines matched urgent keywords'}` : window.newsLabels.noBreaking;
    }
  }
  function setupControls() {
    const search = $('news-search');
    if (search) search.addEventListener('input', () => { searchTerm = search.value.trim(); $('clear-search').classList.toggle('hidden', !searchTerm); renderAll(); });
    const clear = $('clear-search'); if (clear) clear.addEventListener('click', () => { search.value = ''; searchTerm = ''; clear.classList.add('hidden'); renderAll(); });
    const chips = $('category-strip');
    if (chips) chips.addEventListener('click', event => {
      const button = event.target.closest('[data-category]'); if (!button) return;
      visibleCategory = button.dataset.category;
      chips.querySelectorAll('[data-category]').forEach(chip => chip.classList.toggle('active', chip === button));
      renderAll();
    });
    const refresh = $('refresh-news'); if (refresh) refresh.addEventListener('click', () => loadStories(true));
    const showAll = $('show-all-news'); if (showAll) showAll.addEventListener('click', () => { visibleCategory = 'all'; searchTerm = ''; if (search) search.value = ''; if (clear) clear.classList.add('hidden'); if (chips) chips.querySelectorAll('[data-category]').forEach(chip => chip.classList.toggle('active', chip.dataset.category === 'all')); renderAll(); window.scrollTo({ top:0, behavior:'smooth' }); });
    const favoriteNav = document.querySelector('[data-nav="favorites"]');
    if (favoriteNav) favoriteNav.addEventListener('click', () => { document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('selected')); favoriteNav.classList.add('selected'); });
    const homeNav = document.querySelector('[data-nav="home"]');
    if (homeNav) homeNav.addEventListener('click', () => { document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('selected')); homeNav.classList.add('selected'); });
    window.addEventListener('hashchange', () => {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('selected', item.dataset.nav === (location.hash === '#favorites-section' ? 'favorites' : 'home')));
    });
    const langButton = $('language-toggle');
    if (langButton) langButton.addEventListener('click', () => { const next = currentLanguage === 'ar' ? 'en' : 'ar'; localStorage.setItem('news_language_preference', next); window.location.reload(); });
  }
  function start() {
    currentUserId = window.newsCurrentUser?.uid || 'guest';
    populateCountries();
    applyLanguage();
    setupControls();
    loadStories(false);
  }
  document.addEventListener('news:ready', (event) => {
    if (event.detail.page === 'home' || event.detail.page === 'breaking') start();
  });
})();
